name: Portal browser checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install playwright==1.56.0
      - run: google-chrome --version
      - name: Exercise isolated employee sessions on the production build
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/portal-preview.log 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          CHROMIUM_PATH="$(command -v google-chrome)" python tests/portal_smoke.py
